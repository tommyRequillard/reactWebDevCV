name: CI/CD Pipeline
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Correction ici : nom complet indispensable
        run: npm install --legacy-peer-deps

      - name: Build
        # On passe la variable pour le base '/' de Vite
        run: npm run build
        env:
          DEPLOY_TARGET: netlify

      - name: Upload dist directory as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Download artifact (dist)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Prepare Netlify Config
        # On s'assure que le netlify.toml est présent dans le dossier dist avant envoi
        run: cp netlify.toml dist/ || true

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # On déploie directement le dossier dist SANS demander à Netlify de re-build
          netlify deploy --dir "dist" --site $NETLIFY_SITE_ID --auth $NETLIFY_AUTH_TOKEN --prod